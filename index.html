<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0b0d1a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>USNEE</title>
  <script>
    (function () {
      if (!/\/landing(?:\/|$)/.test(location.pathname)) return;
      if (!('serviceWorker' in navigator)) return;
      if (sessionStorage.getItem('usnee-landing-bypass')) return;
      navigator.serviceWorker.getRegistrations().then(function (regs) {
        if (!regs.length) return;
        sessionStorage.setItem('usnee-landing-bypass', '1');
        return Promise.all(regs.map(function (r) { return r.unregister(); }))
          .then(function () { location.reload(); });
      });
    })();
  </script>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    html, body { background: #0b0d1a; color: #ffffff; margin: 0; padding: 0; height: 100%; overflow: hidden; }
    #root { height: 100%; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
